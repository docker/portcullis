version: "2"
run:
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - misspell
    - mirror
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
    - wastedassign
  settings:
    depguard:
      rules:
        # The library targets the standard library + go's own regexp
        # engine. Keep the runtime free of external dependencies so
        # consumers don't inherit transitive risk; testify is allowed
        # in tests only.
        runtime_is_dependency_free:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/example_*.go"
          deny:
            - pkg: github.com/stretchr/testify
              desc: testify is for tests only
    gosec:
      excludes:
        # Zero-copy []byte->string via unsafe is deliberate and
        # documented (FindBytes/ContainsBytes).
        - G103
        # Flagged int conversions are bounds-checked by construction
        # (trie indices, base32/bech32 5-bit groups).
        - G115
        # The scanner's job is opening user-supplied paths.
        - G304
    gocritic:
      disabled-checks:
        - dupImport
        - hugeParam
        - rangeValCopy
        - unnamedResult
        - appendAssign
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
          disabled: false
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests hardcode fake credentials on purpose and use relaxed
      # file permissions / math/rand; gosec adds only noise there.
      - path: _test\.go
        linters:
          - gosec
issues:
  max-same-issues: 3
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/docker/portcullis)
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    gofumpt:
      extra-rules: true
